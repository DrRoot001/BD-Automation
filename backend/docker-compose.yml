version: "3.9"
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
    command: celery -A app.celery_app worker -l info -Q queue:job_discovery,queue:job_processing,queue:resume_generation,queue:application_execution,queue:email_scan

  celery_beat:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
    command: celery -A app.celery_app beat -l info