version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Bind to localhost only to prevent direct public access
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:BdAut0m%40t0r_Str0ng%21@db:5432/bd_automator
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis
    restart: always
    volumes:
      - local_storage:/app/backend/files

    # No source code volumes mounted in production - codebase is built into the image

  db:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=BdAut0m@t0r_Str0ng!
      - POSTGRES_DB=bd_automator
    # Bind to localhost only for security
    ports:
      - "127.0.0.1:5432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    # Bind to localhost only
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    volumes:
      - redis_data:/data

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.celery_app worker --concurrency=1 --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:BdAut0m%40t0r_Str0ng%21@db:5432/bd_automator
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis
    restart: always
    volumes:
      - local_storage:/app/backend/files

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:BdAut0m%40t0r_Str0ng%21@db:5432/bd_automator
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    # Bind to localhost only (Nginx will proxy to port 3000)
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=/api
      - API_URL=http://api:8000
      - SECURE_COOKIE=true
    depends_on:
      - api
    restart: always

volumes:
  postgres_data:
  redis_data:
  local_storage:
